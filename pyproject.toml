[project]
name = "traceit-api"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi[standard]==0.143.3",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    "Pillow==13.0.0",
